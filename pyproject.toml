[project]
name = "rovercarbeto"
version = "0.1.0"
description = "4WD mobile rover on Raspberry Pi 5 + Waveshare WAVE ROVER with a FastAPI backend."
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "frontend", "static", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI expresses dependency injection through `Depends()` in defaults.
"app/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^\\.venv/", "^frontend/"]
