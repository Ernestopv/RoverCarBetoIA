# Bound the container logs so they cannot fill the disk (see AGENTS.md §17).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    environment:
      # Safe defaults: the stack runs without physical hardware.
      ROVER_MODE: ${ROVER_MODE:-simulator}
      CAMERA_MODE: ${CAMERA_MODE:-simulator}
      CAMERA_AUTOSTART: ${CAMERA_AUTOSTART:-true}
      # MediaMTX runs with host networking, so it is reached through the host
      # gateway instead of a compose service name.
      MEDIAMTX_HOST: host.docker.internal
      MEDIAMTX_RTSP_PORT: "8554"
      MEDIAMTX_WEBRTC_PORT: "8889"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
    depends_on:
      - mediamtx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    logging: *default-logging
    restart: unless-stopped

  # Live-video intermediary: RTSP in, WebRTC (WHEP) out.
  # It never records: recording is disabled in docker/mediamtx.yml.
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    # Host networking: MediaMTX sees the Pi's real interfaces, so
    # `webrtcIPsFromInterfaces` advertises the current LAN IP automatically and
    # no MTX_WEBRTCADDITIONALHOSTS is needed. It also removes the Docker NAT hop
    # from the WebRTC path. The API stays local-only via `apiAddress` in
    # docker/mediamtx.yml.
    network_mode: host
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    logging: *default-logging
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${UI_PORT:-8080}:80"
    logging: *default-logging
    restart: unless-stopped
