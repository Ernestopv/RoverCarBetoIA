# Bound the container logs so they cannot fill the disk (see AGENTS.md §17).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    environment:
      # Safe defaults: the stack runs without physical hardware.
      ROVER_MODE: ${ROVER_MODE:-simulator}
      CAMERA_MODE: ${CAMERA_MODE:-simulator}
      CAMERA_AUTOSTART: ${CAMERA_AUTOSTART:-true}
      # Inside the compose network MediaMTX is reachable by service name.
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: "8554"
      MEDIAMTX_WEBRTC_PORT: "8889"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
    depends_on:
      - mediamtx
    ports:
      - "${API_PORT:-8000}:8000"
    logging: *default-logging
    restart: unless-stopped

  # Live-video intermediary: RTSP in, WebRTC (WHEP) out.
  # It never records: recording is disabled in docker/mediamtx.yml.
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    environment:
      # A browser on the Docker host must reach the ICE listener through the
      # published UDP port, so advertise the loopback address as well as the
      # interface addresses. Harmless when MediaMTX runs natively on the Pi.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_ADDITIONAL_HOSTS:-127.0.0.1}
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      # Diagnostics only: bound to the local machine, never to the network.
      - "127.0.0.1:${MEDIAMTX_API_PORT:-9997}:9997"
      - "${MEDIAMTX_ICE_UDP_PORT:-8189}:8189/udp"
    logging: *default-logging
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${UI_PORT:-8080}:80"
    logging: *default-logging
    restart: unless-stopped
