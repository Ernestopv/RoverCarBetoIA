# Reverse proxy for the RoverCarBeto stack.
# Video streaming (MediaMTX/WebRTC) will be added in Phase 5; it must never be
# proxied frame by frame through FastAPI.

upstream rovercarbeto_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # SPA shell: never cache it, so a new build is picked up on reload.
    # Without this, a browser can keep serving a stale index.html and the user
    # never sees the new frontend.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Build assets carry a content hash in their name: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API: never cache. Telemetry is polled every second, so a cached
    # response would show stale data.
    location /api/ {
        proxy_pass http://rovercarbeto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # The AI stream: the backend pushes each inference result as the sensor
    # produces it, so this one upgrades to a WebSocket.
    #
    # It needs its own location because the `/api/` block above does not forward
    # the upgrade headers, and it needs a far longer read timeout than a REST
    # call. A longer matching prefix wins over `/api/`, so the rest of the API is
    # untouched.
    location /api/v1/ai/stream {
        proxy_pass http://rovercarbeto_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The model switch restarts the camera, and the *first* load of a network
    # uploads firmware to the sensor: tens of seconds, longer than the 30s REST
    # timeout above. Longer matching prefixes win, so this only touches the
    # switch itself.
    location /api/v1/ai/model {
        proxy_pass http://rovercarbeto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
}
